[project]
name = "proyecto_multiagentes_para_ml_clasificacion_openai"
version = "0.1.0"
description = "proyecto_multiagentes_para_ml_clasificacion_openai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.1"
]

[project.scripts]
proyecto_multiagentes_para_ml_clasificacion_openai = "proyecto_multiagentes_para_ml_clasificacion_openai.main:run"
run_crew = "proyecto_multiagentes_para_ml_clasificacion_openai.main:run"
train = "proyecto_multiagentes_para_ml_clasificacion_openai.main:train"
replay = "proyecto_multiagentes_para_ml_clasificacion_openai.main:replay"
test = "proyecto_multiagentes_para_ml_clasificacion_openai.main:test"
run_with_trigger = "proyecto_multiagentes_para_ml_clasificacion_openai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
