[project]
name = "proyecto_multiagentes_para_ml_gemini"
version = "0.1.0"
description = "proyecto_multiagentes_para_ml_gemini using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,google-genai]==1.14.1",
    "pandas>=2.0.0"
]

[project.scripts]
proyecto_multiagentes_para_ml_gemini = "proyecto_multiagentes_para_ml_gemini.main:run"
run_crew = "proyecto_multiagentes_para_ml_gemini.main:run"
train = "proyecto_multiagentes_para_ml_gemini.main:train"
replay = "proyecto_multiagentes_para_ml_gemini.main:replay"
test = "proyecto_multiagentes_para_ml_gemini.main:test"
run_with_trigger = "proyecto_multiagentes_para_ml_gemini.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
